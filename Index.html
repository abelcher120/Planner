<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taskflow — Dean's Workspace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f7f7f5;--bg-tertiary:#f0eeea;
  --text-primary:#1a1a18;--text-secondary:#6b6b67;--text-tertiary:#a0a09c;
  --border-light:rgba(0,0,0,0.10);--border-med:rgba(0,0,0,0.18);--border-strong:rgba(0,0,0,0.28);
  --radius-md:8px;--radius-lg:12px;--danger:#E24B4A;--success:#1D9E75;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code",Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#1c1c1a;--bg-secondary:#242422;--bg-tertiary:#2a2a28;
  --text-primary:#e8e8e4;--text-secondary:#9a9a96;--text-tertiary:#666662;
  --border-light:rgba(255,255,255,0.08);--border-med:rgba(255,255,255,0.14);--border-strong:rgba(255,255,255,0.22);
}}
body{font-family:var(--font);background:var(--bg-tertiary);color:var(--text-primary);height:100vh;display:flex;overflow:hidden}
.app{display:flex;width:100%;height:100vh;overflow:hidden}
.sidebar{width:212px;min-width:212px;border-right:0.5px solid var(--border-light);background:var(--bg-secondary);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:14px 14px 10px;border-bottom:0.5px solid var(--border-light);flex-shrink:0}
.sb-logo h1{font-size:15px;font-weight:500}
.sb-logo p{font-size:10px;color:var(--text-secondary);margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 6px}
.sb-track{padding:8px 6px 2px}
.sb-track-label{font-size:10px;font-weight:500;color:var(--text-tertiary);padding:3px 7px 4px;text-transform:uppercase;letter-spacing:.7px}
.nav-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius-md);font-size:12px;cursor:pointer;color:var(--text-secondary);border:none;background:none;width:100%;text-align:left;transition:background .1s}
.nav-item:hover{background:var(--bg-primary);color:var(--text-primary)}
.nav-item.active{background:var(--bg-primary);color:var(--text-primary);font-weight:500}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nav-count{margin-left:auto;font-size:10px;color:var(--text-tertiary);background:var(--bg-tertiary);padding:1px 5px;border-radius:8px;flex-shrink:0}
.sb-divider{height:0.5px;background:var(--border-light);margin:6px 0}
.sb-bottom{padding:6px;border-top:0.5px solid var(--border-light);flex-shrink:0}
.sb-add{border:0.5px dashed var(--border-med);border-radius:var(--radius-md);padding:6px 8px;font-size:11px;color:var(--text-secondary);cursor:pointer;background:none;display:flex;align-items:center;gap:5px;width:100%;transition:all .1s;margin-bottom:4px}
.sb-add:hover{border-color:var(--border-strong);color:var(--text-primary);background:var(--bg-primary)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary)}
.topbar{padding:12px 18px;border-bottom:0.5px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:500}
.tba{display:flex;gap:6px;align-items:center}
.btn{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:var(--radius-md);font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-med);background:var(--bg-primary);color:var(--text-primary);transition:all .1s;white-space:nowrap}
.btn:hover{background:var(--bg-secondary)}
.btn.primary{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary)}
.btn.primary:hover{opacity:.82}
.btn.agenda-btn{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.btn.agenda-btn:hover{background:#CECBF6}
.filter-bar{padding:8px 18px;border-bottom:0.5px solid var(--border-light);display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.fpill{padding:3px 9px;border-radius:8px;font-size:11px;border:0.5px solid var(--border-light);background:none;cursor:pointer;color:var(--text-secondary);transition:all .1s}
.fpill:hover,.fpill.active{background:var(--bg-secondary);color:var(--text-primary);border-color:var(--border-med);font-weight:500}
.sw{margin-left:auto;position:relative}
.sw i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-tertiary);pointer-events:none}
.si{padding:5px 8px 5px 26px;border-radius:var(--radius-md);border:0.5px solid var(--border-light);background:var(--bg-secondary);font-size:11px;width:140px;color:var(--text-primary);outline:none}
.board{display:flex;gap:10px;padding:14px 18px;overflow-x:auto;flex:1;align-items:flex-start}
.col{min-width:200px;width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.col-hd{display:flex;align-items:center;gap:6px;padding:0 2px 4px}
.col-t{font-size:12px;font-weight:500}
.col-n{font-size:10px;color:var(--text-tertiary);background:var(--bg-secondary);padding:1px 5px;border-radius:7px}
.tc{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:9px 11px;cursor:pointer;transition:border-color .1s}
.tc:hover{border-color:var(--border-med)}
.tc.on-agenda{border-left:2px solid #7F77DD;border-radius:0 var(--radius-md) var(--radius-md) 0}
.tc-top{display:flex;align-items:flex-start;gap:5px;margin-bottom:6px}
.tc-title{font-size:12px;line-height:1.4;flex:1}
.prio-btn{border:none;background:none;cursor:pointer;padding:1px;border-radius:3px;flex-shrink:0;display:flex;align-items:center}
.prio-btn:hover{background:var(--bg-secondary)}
.tc-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500}
.av{width:18px;height:18px;border-radius:50%;font-size:8px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}
.due{font-size:10px;color:var(--text-tertiary);display:flex;align-items:center;gap:2px}
.due.ov{color:var(--danger)}
.tc-ind{display:flex;align-items:center;gap:5px;margin-top:5px;padding-top:5px;border-top:0.5px solid var(--border-light)}
.ind{font-size:10px;color:var(--text-tertiary);display:flex;align-items:center;gap:2px}
.ind.on{color:var(--text-secondary)}
.ind.ag{color:#534AB7}
.atb{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:var(--radius-md);font-size:11px;color:var(--text-tertiary);cursor:pointer;border:0.5px dashed var(--border-light);background:none;transition:all .1s;width:100%}
.atb:hover{border-color:var(--border-med);color:var(--text-secondary);background:var(--bg-secondary)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px 0}
.modal{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-lg);width:min(520px,96vw);padding:20px 22px;margin:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:0.5px solid var(--border-med);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:12px;font-family:var(--font);outline:none}
.field textarea{min-height:64px;resize:vertical}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border-light);margin:0 -22px;padding:0 22px}
.tab{font-size:11px;padding:7px 11px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:all .1s}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--text-primary);border-bottom-color:var(--text-primary);font-weight:500}
.spinner{display:inline-block;width:12px;height:12px;border:1.5px solid var(--border-med);border-top-color:var(--text-secondary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{height:3px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin-top:3px}
.pbar-fill{height:100%;background:#1D9E75;border-radius:2px;transition:width .3s}
.step-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border-light)}
.step-item:last-child{border-bottom:none}
.step-ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-med);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:none;transition:all .1s}
.step-ck.done{background:#1D9E75;border-color:#1D9E75}
.step-ck.done i{color:white;font-size:8px}
.step-txt{font-size:11px;line-height:1.4;flex:1}
.step-txt.done{text-decoration:line-through;color:var(--text-tertiary)}
.step-del{border:none;background:none;cursor:pointer;color:var(--text-tertiary);font-size:11px;padding:1px 3px}
.step-del:hover{color:var(--danger)}
.cmt-item{display:flex;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border-light)}
.cmt-item:last-child{border-bottom:none}
.cmt-av{width:22px;height:22px;border-radius:50%;font-size:8px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmt-author{font-size:11px;font-weight:500}
.cmt-time{font-size:10px;color:var(--text-tertiary);margin-left:5px}
.cmt-text{font-size:11px;color:var(--text-secondary);margin-top:2px;line-height:1.5}
.prio-sel{display:flex;gap:5px;flex-wrap:wrap}
.popt{padding:4px 9px;border-radius:var(--radius-md);font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all .1s}
.popt.sel{border-color:currentColor}
.mcard{background:var(--bg-primary);border:0.5px solid var(--border-light);border-radius:var(--radius-md);padding:11px 13px;cursor:pointer;transition:border-color .1s;margin-bottom:8px}
.mcard:hover{border-color:var(--border-med)}
.mtype-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.ag-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:0 var(--radius-md) var(--radius-md) 0;background:var(--bg-secondary);margin-bottom:6px;border-left:2px solid #7F77DD}
.ag-item.resolved{opacity:.45}
.ag-num{font-size:11px;font-weight:500;color:#534AB7;min-width:18px;margin-top:1px}
.ag-body{flex:1}
.ag-text{font-size:12px;line-height:1.35;cursor:pointer}
.ag-text:hover{text-decoration:underline}
.ag-text.resolved{text-decoration:line-through;color:var(--text-tertiary)}
.ag-note{font-size:10px;color:#534AB7;margin-top:2px}
.ag-actions{display:flex;gap:4px;margin-top:5px}
.week-header{font-size:10px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;padding:8px 0 5px;border-bottom:0.5px solid var(--border-light);margin-bottom:7px}
.color-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:4px 0}
.color-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.color-swatch:hover{opacity:.85}
.color-swatch.selected{border-color:var(--text-primary)}
.color-preview{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-secondary);border-radius:var(--radius-md);margin-top:9px}
.color-hex-input{flex:1;padding:5px 8px;border:0.5px solid var(--border-med);border-radius:var(--radius-md);font-size:11px;font-family:var(--font-mono);background:var(--bg-primary);color:var(--text-primary);outline:none;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--bg-primary);padding:8px 18px;border-radius:var(--radius-md);font-size:12px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app" id="app">
  <div class="sidebar">
    <div class="sb-logo">
      <h1><i class="ti ti-layout-kanban" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Taskflow</h1>
      <p>Dean's workspace</p>
    </div>
    <div class="sb-scroll">
      <div class="sb-track" style="padding-top:10px">
        <div class="sb-track-label"><i class="ti ti-notes" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>Meetings</div>
        <button class="nav-item active" id="nv-week" onclick="gotoView('week',this)"><i class="ti ti-calendar-week"></i> This week <span class="nav-count" id="week-count">0</span></button>
        <button class="nav-item" id="nv-allm" onclick="gotoView('allm',this)"><i class="ti ti-list"></i> All meetings <span class="nav-count" id="allm-count">0</span></button>
        <div style="font-size:10px;color:var(--text-tertiary);padding:6px 8px 2px;font-weight:500">Series</div>
        <div id="series-nav"></div>
      </div>
      <div class="sb-divider"></div>
      <div class="sb-track">
        <div class="sb-track-label"><i class="ti ti-layout-columns" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>Projects</div>
        <button class="nav-item" id="nv-alltasks" onclick="gotoView('alltasks',this)"><i class="ti ti-checkbox"></i> All tasks <span class="nav-count" id="alltasks-count">0</span></button>
        <div style="font-size:10px;color:var(--text-tertiary);padding:6px 8px 2px;font-weight:500">Boards</div>
        <div id="proj-nav"></div>
      </div>
      <div class="sb-divider"></div>
      <button class="nav-item" id="nv-overview" onclick="gotoView('overview',this)"><i class="ti ti-chart-bar"></i> Overview</button>
    </div>
    <div class="sb-bottom">
      <button class="sb-add" onclick="openNewMeeting()"><i class="ti ti-plus"></i> New meeting</button>
      <button class="sb-add" onclick="openProjectModal()"><i class="ti ti-plus"></i> New project</button>
    </div>
  </div>
  <div class="main" id="main-view"></div>
  <div id="modal-container"></div>
</div>
<script>
const PALETTE=['#E24B4A','#D85A30','#BA7517','#639922','#1D9E75','#378ADD','#7F77DD','#D4537E','#888780','#0F6E56','#185FA5','#534AB7','#993556','#854F0B','#3B6D11','#5F5E5A','#C2185B','#EF9F27','#5DCAA5','#85B7EB','#AFA9EC','#F0997B','#ED93B1','#97C459','#FAC775','#B5D4F4','#9FE1CB','#F4C0D1','#C0DD97','#D3D1C7'];
const PRI={urgent:{label:'Urgent',color:'#E24B4A',bg:'#FCEBEB',tc:'#A32D2D',icon:'ti-flame'},high:{label:'High',color:'#EF9F27',bg:'#FAEEDA',tc:'#633806',icon:'ti-arrow-up'},medium:{label:'Med',color:'#378ADD',bg:'#E6F1FB',tc:'#0C447C',icon:'ti-minus'},low:{label:'Low',color:'#639922',bg:'#EAF3DE',tc:'#27500A',icon:'ti-arrow-down'}};
const COLS=[{id:'todo',label:'To do',color:'#888780'},{id:'inprogress',label:'In progress',color:'#378ADD'},{id:'review',label:'Review',color:'#BA7517'},{id:'done',label:'Done',color:'#1D9E75'}];
const AVS=[{init:'AL',bg:'#B5D4F4',tc:'#0C447C'},{init:'JM',bg:'#9FE1CB',tc:'#085041'},{init:'RS',bg:'#F4C0D1',tc:'#72243E'},{init:'TK',bg:'#FAC775',tc:'#633806'}];
const SERIES_COLORS={exec:{color:'#534AB7',bg:'#EEEDFE',tc:'#3C3489'},school:{color:'#0F6E56',bg:'#E1F5EE',tc:'#085041'},budget:{color:'#854F0B',bg:'#FAEEDA',tc:'#633806'},faculty:{color:'#993556',bg:'#FBEAF0',tc:'#72243E'},other:{color:'#5F5E5A',bg:'#F1EFE8',tc:'#444441'}};
const DEFAULT_STATE={
  projects:[{id:'p1',name:'Office of the Dean',hex:'#378ADD'}],
  series:[{id:'s1',name:'Exec Committee',color_key:'exec'},{id:'s2',name:'School Meeting',color_key:'school'},{id:'s3',name:'Budget Review',color_key:'budget'},{id:'s4',name:'Faculty Affairs',color_key:'faculty'}],
  tasks:[],meetings:[]
};

let S={projects:[],series:[],tasks:[],meetings:[],view:'week',activeProject:'p1',activeSeries:null,activeMeeting:null,editingMeeting:null,filter:'all',search:'',activeTab:{}};
let selPrio='medium',selSid='other',_customHex='#378ADD';

function save(){try{localStorage.setItem('taskflow',JSON.stringify({projects:S.projects,series:S.series,tasks:S.tasks,meetings:S.meetings}));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem('taskflow');
    if(raw){const d=JSON.parse(raw);S.projects=d.projects||DEFAULT_STATE.projects;S.series=d.series||DEFAULT_STATE.series;S.tasks=d.tasks||[];S.meetings=d.meetings||[];}
    else{S.projects=DEFAULT_STATE.projects;S.series=DEFAULT_STATE.series;S.tasks=[];S.meetings=[];}
  }catch(e){S.projects=DEFAULT_STATE.projects;S.series=DEFAULT_STATE.series;S.tasks=[];S.meetings=[];}
  if(S.projects.length)S.activeProject=S.projects[0].id;
}

function toast(msg,dur=2200){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function gp(id){return S.projects.find(p=>p.id===id)}
function gt(id){return S.tasks.find(t=>t.id===id)}
function gm(id){return S.meetings.find(m=>m.id===id)}
function gs(id){return S.series.find(s=>s.id===id)}
function sc(sid){return SERIES_COLORS[gs(sid)?.color_key||'other']||SERIES_COLORS.other}
function taskAgMeetings(tid){return S.meetings.filter(m=>(m.agendaItems||[]).some(a=>a.tid===tid))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}
function colorBg(h){const{r,g,b}=hexToRgb(h);return`rgba(${r},${g},${b},0.13)`}
function colorText(h){const{r,g,b}=hexToRgb(h);const l=(0.299*r+0.587*g+0.114*b)/255;if(l>0.55){const f=0.45;return`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`}return h}
function gpc(pid){const h=gp(pid)?.hex||'#888780';return{dot:h,bg:colorBg(h),text:colorText(h)}}

function gotoView(v,el){
  S.view=v;S.activeMeeting=null;S.editingMeeting=null;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  else{const nid={week:'nv-week',allm:'nv-allm',overview:'nv-overview',alltasks:'nv-alltasks'}[v];if(nid){const n=document.getElementById(nid);if(n)n.classList.add('active');}}
  render();
}
function setProject(pid){S.activeProject=pid;S.view='board';document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));render()}
function setSeries(sid){S.activeSeries=sid;S.view='series';document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));render()}
function setFilter(f){S.filter=f;render()}
function cyclePrio(tid,e){e.stopPropagation();const ord=['low','medium','high','urgent'];const t=gt(tid);if(!t)return;t.priority=ord[(ord.indexOf(t.priority)+1)%ord.length];save();render();}

function buildColorPicker(cx){
  const sw=PALETTE.map(h=>`<div class="color-swatch${h.toUpperCase()===cx.toUpperCase()?' selected':''}" style="background:${h}" onclick="pickSwatch('${h}')" title="${h}"></div>`).join('');
  return`<div class="color-grid">${sw}</div><div class="color-preview"><div id="color-dot-preview" style="width:24px;height:24px;border-radius:50%;background:${cx};flex-shrink:0"></div><input class="color-hex-input" id="hex-input" value="${cx}" maxlength="7" oninput="onHexInput(this.value)"/><input type="color" id="color-native" value="${cx}" oninput="onNativePick(this.value)" style="width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;border-radius:4px"/></div>`;
}
function pickSwatch(h){_customHex=h;document.querySelectorAll('.color-swatch').forEach(el=>el.classList.toggle('selected',el.style.background===h||el.style.backgroundColor===h));const d=document.getElementById('color-dot-preview');if(d)d.style.background=h;const hi=document.getElementById('hex-input');if(hi)hi.value=h;const cn=document.getElementById('color-native');if(cn)cn.value=h;}
function onHexInput(v){if(/^#[0-9A-Fa-f]{6}$/.test(v)){_customHex=v.toUpperCase();const d=document.getElementById('color-dot-preview');if(d)d.style.background=_customHex;const cn=document.getElementById('color-native');if(cn)cn.value=_customHex;document.querySelectorAll('.color-swatch').forEach(el=>el.classList.remove('selected'));}}
function onNativePick(v){_customHex=v.toUpperCase();const d=document.getElementById('color-dot-preview');if(d)d.style.background=_customHex;const hi=document.getElementById('hex-input');if(hi)hi.value=_customHex;document.querySelectorAll('.color-swatch').forEach(el=>el.classList.remove('selected'));}

function openProjectModal(editPid){
  const ed=editPid?gp(editPid):null;const ix=ed?.hex||PALETTE[Math.floor(Math.random()*PALETTE.length)];_customHex=ix;
  showModal(`<h3>${ed?'Edit project':'New project'}</h3>
    <div class="field"><label>Project name</label><input id="pname" value="${ed?.name||''}" placeholder="e.g. Faculty Senate Liaison"/></div>
    <div class="field"><label>Color</label>${buildColorPicker(ix)}</div>
    <div class="ma">${ed?`<button class="btn" style="color:var(--danger);margin-right:auto" onclick="deleteProject('${editPid}')"><i class="ti ti-trash"></i> Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="${ed?`saveProject('${editPid}')`:'createProject()'}"><i class="ti ti-${ed?'device-floppy':'plus'}"></i> ${ed?'Save':'Create'}</button></div>`);
}
function createProject(){
  const name=document.getElementById('pname')?.value?.trim();if(!name)return;
  const p={id:'p'+uid(),name,hex:_customHex};S.projects.push(p);S.activeProject=p.id;S.view='board';closeModal();save();render();toast('Project created');
}
function saveProject(pid){
  const name=document.getElementById('pname')?.value?.trim();if(!name)return;
  const p=gp(pid);if(!p)return;p.name=name;p.hex=_customHex;closeModal();save();render();toast('Project saved');
}
function deleteProject(pid){
  if(S.tasks.some(t=>t.pid===pid)){alert('Move or delete all tasks first.');return;}
  S.projects=S.projects.filter(p=>p.id!==pid);if(S.activeProject===pid)S.activeProject=S.projects[0]?.id||null;
  closeModal();save();render();
}
function openSeriesModal(){

function createSeries(){

function openTaskModal(pid,status){
  const popts=Object.entries(PRI).map(([k,v])=>`<div class="popt" id="po-${k}" style="background:${v.bg};color:${v.tc}" onclick="selPrio='${k}';document.querySelectorAll('.popt').forEach(el=>el.classList.remove('sel'));this.classList.add('sel')">${v.label}</div>`).join('');
  const projOpts=S.projects.map(p=>`<option value="${p.id}"${p.id===(pid||S.activeProject)?' selected':''}>${p.name}</option>`).join('');

function createTask(ov){
  const title=ov?.title||(document.getElementById('ttitle')?.value?.trim());if(!title)return null;
  const tags=ov?.tags||(document.getElementById('ttags')?.value?.split(',').map(t=>t.trim()).filter(Boolean)||[]);
  const t={id:'t'+uid(),pid:ov?.pid||document.getElementById('tpid')?.value||S.activeProject,title,desc:ov?.desc||'',status:ov?.status||document.getElementById('tstat')?.value||'todo',priority:ov?.priority||selPrio,assignee:ov?.assignee!=null?ov.assignee:parseInt(document.getElementById('tassign')?.value||'0'),due:ov?.due||document.getElementById('tdue')?.value||'',tags,comments:[],steps:[],agendaMids:[]};
  S.tasks.push(t);if(!ov)closeModal();save();render();return t.id;
}
function moveTask(tid,status){const t=gt(tid);if(t){t.status=status;save();}closeModal();render();}
function delTask(tid){S.tasks=S.tasks.filter(x=>x.id!==tid);save();closeModal();render();}

function openPromoteModal(tid){
  const t=gt(tid);if(!t)return;
  const rows=S.meetings.map(m=>{const c=sc(m.sid);const already=(m.agendaItems||[]).some(a=>a.tid===tid);return`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-md);border:0.5px solid ${already?'#7F77DD':'var(--border-light)'};background:${already?'#EEEDFE':'var(--bg-primary)'};margin-bottom:6px;${already?'':'cursor:pointer'}" ${already?'':` onclick="doPromote('${m.id}')"`}><span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${c.bg};color:${c.tc};font-weight:500;flex-shrink:0">${gs(m.sid)?.name||'Meeting'}</span><span style="font-size:12px;flex:1">${m.title}</span><span style="font-size:10px;color:var(--text-tertiary)">${m.date}</span>${already?`<span style="font-size:10px;color:#534AB7;font-weight:500;display:flex;align-items:center;gap:2px"><i class="ti ti-check" style="font-size:10px"></i> Added</span>`:`<button class="btn agenda-btn" style="font-size:10px;padding:2px 8px">Add</button>`}</div>`;}).join('');

  window._promoteTid=tid;
}
function doPromote(mid){
  const tid=window._promoteTid;if(!tid)return;const t=gt(tid);const m=gm(mid);if(!t||!m)return;
  const note=document.getElementById('ag-note')?.value?.trim()||'';
  if(!m.agendaItems)m.agendaItems=[];
  if(!m.agendaItems.find(a=>a.tid===tid)){
    m.agendaItems.push({id:'ag'+uid(),tid,text:t.title,note,resolved:false});
    if(!t.agendaMids)t.agendaMids=[];if(!t.agendaMids.includes(mid))t.agendaMids.push(mid);
    if(!m.linkedTasks)m.linkedTasks=[];if(!m.linkedTasks.includes(tid))m.linkedTasks.push(tid);
    save();
  }
  render();openPromoteModal(tid);
}
function resolveAg(mid,agid){const m=gm(mid);if(!m)return;const ag=(m.agendaItems||[]).find(a=>a.id===agid);if(ag)ag.resolved=!ag.resolved;save();render();if(S.view==='meeting')renderMeetingView(m);}
function removeAg(mid,agid){
  const m=gm(mid);if(!m)return;const ag=(m.agendaItems||[]).find(a=>a.id===agid);
  if(ag){const t=gt(ag.tid);if(t)t.agendaMids=(t.agendaMids||[]).filter(x=>x!==mid);}
  m.agendaItems=(m.agendaItems||[]).filter(a=>a.id!==agid);save();render();if(S.view==='meeting')renderMeetingView(m);
}

function openTaskDetail(tid){const t=gt(tid);if(!t)return;if(!S.activeTab[tid])S.activeTab[tid]='steps';renderTaskModal(t);}
function renderTaskModal(t){
  const pc=gpc(t.pid);const av=AVS[t.assignee];const pr=PRI[t.priority];
  const isOv=t.due&&new Date(t.due)<new Date()&&t.status!=='done';
  const donePct=t.steps.length?Math.round(t.steps.filter(s=>s.done).length/t.steps.length*100):0;

  const pbuts=Object.entries(PRI).map(([k,v])=>`<button class="popt" style="background:${v.bg};color:${v.tc};${t.priority===k?`border-color:${v.tc}`:'opacity:.5'}" onclick="changePrio('${t.id}','${k}')">${v.label}</button>`).join('');

    <div>${sl||'<div style="font-size:11px;color:var(--text-tertiary);padding:6px 0">No steps yet.</div>'}</div>
    <div style="display:flex;gap:6px;margin-top:8px"><input id="ns" placeholder="Add next step..." style="flex:1;padding:5px 8px;border:0.5px solid var(--border-med);border-radius:var(--radius-md);font-size:12px;background:var(--bg-primary);color:var(--text-primary);outline:none;font-family:var(--font)" onkeydown="if(event.key==='Enter')addStep('${t.id}')"/><button class="btn" onclick="addStep('${t.id}')" style="padding:5px 8px"><i class="ti ti-plus"></i></button></div>`;
  } else if(tab==='comments'){
    const cl=t.comments.map(c=>{const a=AVS[c.author];return`<div class="cmt-item"><div class="cmt-av" style="background:${a.bg};color:${a.tc}">${a.init}</div><div><span class="cmt-author">${a.init}</span><span class="cmt-time">${c.time}</span><div class="cmt-text">${c.text}</div></div></div>`;}).join('');
    tc=`<div>${cl||'<div style="font-size:11px;color:var(--text-tertiary);padding:6px 0">No comments.</div>'}</div><div style="display:flex;gap:6px;align-items:flex-end;margin-top:8px"><textarea id="nc" rows="2" placeholder="Comment..." style="flex:1;padding:5px 8px;border:0.5px solid var(--border-med);border-radius:var(--radius-md);font-size:12px;font-family:var(--font);background:var(--bg-primary);color:var(--text-primary);resize:none;outline:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addComment('${t.id}')}"></textarea><button class="btn primary" onclick="addComment('${t.id}')" style="padding:5px 9px;align-self:flex-end"><i class="ti ti-send"></i></button></div>`;
  } else if(tab==='ai'){
    tc=`<div id="ai-out" style="font-size:12px;line-height:1.6;color:var(--text-secondary);background:var(--bg-secondary);border-radius:var(--radius-md);padding:10px 12px;min-height:60px"><button class="btn" style="font-size:11px;padding:4px 10px" onclick="getAIBreakdown('${t.id}')"><i class="ti ti-sparkles"></i> Generate subtasks</button></div>`;
  }
  showModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span class="tag" style="background:${pc.bg};color:${pc.text};font-size:11px;cursor:pointer" onclick="closeModal();openProjectModal('${t.pid}')">${gp(t.pid)?.name}</span>
      <div style="display:flex;gap:5px">
        <button class="btn agenda-btn" style="font-size:11px;padding:4px 9px" onclick="closeModal();openPromoteModal('${t.id}')"><i class="ti ti-speakerphone"></i> Add to agenda</button>
        <button class="btn" style="padding:4px 7px" onclick="delTask('${t.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    <div style="font-size:15px;font-weight:500;margin-bottom:5px;line-height:1.35">${t.title}</div>
    ${ams.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px">${ams.map(m=>{const c=sc(m.sid);return`<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${c.bg};color:${c.tc};display:inline-flex;align-items:center;gap:3px"><i class="ti ti-speakerphone" style="font-size:9px"></i>${m.title}</span>`;}).join('')}</div>`:''}
    <div style="margin-bottom:11px"><div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Priority</div><div class="prio-sel">${pbuts}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px;font-size:12px">
      <div><div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">Status</div>${COLS.find(c=>c.id===t.status)?.label}</div>
      <div><div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">Assignee</div><div style="display:flex;align-items:center;gap:4px"><span style="width:17px;height:17px;border-radius:50%;background:${av.bg};color:${av.tc};font-size:8px;font-weight:500;display:inline-flex;align-items:center;justify-content:center">${av.init}</span>${av.init}</div></div>
      <div><div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">Due</div><span style="color:${isOv?'var(--danger)':'var(--text-primary)'}">${t.due||'—'}</span></div>
    </div>
    <div style="display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap">${COLS.filter(c=>c.id!==t.status).map(c=>`<button class="btn" style="font-size:11px;padding:3px 8px" onclick="moveTask('${t.id}','${c.id}')">→ ${c.label}</button>`).join('')}</div>
    <div class="tab-bar" style="margin-bottom:11px">
      <button class="tab ${tab==='steps'?'active':''}" onclick="switchTab('${t.id}','steps')"><i class="ti ti-checks" style="font-size:11px;vertical-align:-1px"></i> Steps${t.steps.length?` (${t.steps.length})`:''}</button>
      <button class="tab ${tab==='comments'?'active':''}" onclick="switchTab('${t.id}','comments')"><i class="ti ti-message" style="font-size:11px;vertical-align:-1px"></i> Comments${t.comments.length?` (${t.comments.length})`:''}</button>
      <button class="tab ${tab==='ai'?'active':''}" onclick="switchTab('${t.id}','ai')"><i class="ti ti-sparkles" style="font-size:11px;vertical-align:-1px"></i> AI assist</button>
    </div>
    <div>${tc}</div>`);
}
function switchTab(tid,tab){S.activeTab[tid]=tab;openTaskDetail(tid)}
function changePrio(tid,p){const t=gt(tid);if(!t)return;t.priority=p;save();render();openTaskDetail(tid);}
function addStep(tid){const inp=document.getElementById('ns');const tx=inp?.value?.trim();if(!tx)return;const t=gt(tid);if(!t)return;t.steps.push({id:'s'+uid(),text:tx,done:false});inp.value='';save();openTaskDetail(tid);render();}
function toggleStep(tid,sid){const t=gt(tid);if(!t)return;const s=t.steps.find(x=>x.id===sid);if(s)s.done=!s.done;save();openTaskDetail(tid);render();}
function delStep(tid,sid){const t=gt(tid);if(!t)return;t.steps=t.steps.filter(s=>s.id!==sid);save();openTaskDetail(tid);render();}
function addComment(tid){const inp=document.getElementById('nc');const tx=inp?.value?.trim();if(!tx)return;const t=gt(tid);if(!t)return;t.comments.push({id:'c'+uid(),author:0,text:tx,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});inp.value='';save();openTaskDetail(tid);}

const API_KEY_STORAGE='taskflow-api-key';
function getApiKey(){let k=sessionStorage.getItem(API_KEY_STORAGE);if(!k){k=prompt('Enter your Anthropic API key (stored in session only):');if(k)sessionStorage.setItem(API_KEY_STORAGE,k);}return k;}
async function callClaude(prompt){
  const key=getApiKey();if(!key)throw new Error('No API key');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('API error '+r.status);
  const d=await r.json();return d.content?.find(c=>c.type==='text')?.text||'';
}
async function getAIBreakdown(tid){
  const t=gt(tid);if(!t)return;const out=document.getElementById('ai-out');if(!out)return;
  out.innerHTML='<span class="spinner"></span> Thinking...';
  try{
    const tx=await callClaude(`Break this task into 4-5 concrete next steps. Task: "${t.title}". Project: "${gp(t.pid)?.name}". Priority: ${t.priority}. Bullet points only, no intro, each under 12 words.`);
    out.innerHTML=`<div style="font-size:12px;line-height:1.7;color:var(--text-secondary)">${tx.replace(/\n/g,'<br>')}</div><button class="btn" style="font-size:11px;padding:4px 9px;margin-top:7px" onclick="addAISteps('${tid}')"><i class="ti ti-plus"></i> Add as steps</button>`;
    out._aiText=tx;
  }catch(e){out.innerHTML=`<span style="color:var(--danger);font-size:12px">Error: ${e.message}</span>`;}
}
function addAISteps(tid){
  const out=document.getElementById('ai-out');const tx=out?._aiText||'';const t=gt(tid);if(!t)return;
  tx.split('\n').map(l=>l.replace(/^[-•*]\s*/,'')).filter(l=>l.trim().length>3).forEach(l=>t.steps.push({id:'s'+uid(),text:l.trim(),done:false}));
  save();openTaskDetail(tid);render();
}

function openNewMeeting(){
  S.editingMeeting={id:'m'+uid(),title:'',sid:S.series[0]?.id||'',date:new Date().toISOString().slice(0,10),attendees:[0],notes:'',aiItems:[],linkedTasks:[],agendaItems:[],_new:true};
  S.view='meeting-edit';render();
}
function openMeeting(mid){S.activeMeeting=mid;S.view='meeting';render()}
function saveMeeting(){
  const m=S.editingMeeting;if(!m)return;
  m.title=document.getElementById('mt')?.value?.trim()||'Untitled meeting';
  m.notes=document.getElementById('mn')?.value||'';
  m.date=document.getElementById('md')?.value||m.date;
  m.sid=document.getElementById('msid')?.value||m.sid;
  if(m._new){delete m._new;S.meetings.unshift(m)}else{const i=S.meetings.findIndex(x=>x.id===m.id);if(i>=0)S.meetings[i]=m;}
  S.activeMeeting=m.id;S.editingMeeting=null;S.view='meeting';save();render();toast('Meeting saved');
}
async function analyzeMeeting(mid){
  const m=gm(mid);if(!m)return;const out=document.getElementById('ai-meeting-out');if(!out)return;
  out.innerHTML='<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)"><span class="spinner"></span> Analyzing...</div>';
  try{
    const projList=S.projects.map(p=>`${p.id}: ${p.name}`).join(', ');
    const tx=await callClaude(`Analyze these meeting notes. Extract action items and new project ideas. Available projects: ${projList}\n\nMeeting: "${m.title}"\nNotes:\n${m.notes}\n\nRespond ONLY with valid JSON (no markdown):\n{"items":[{"type":"task","text":"...","priority":"high|medium|low","pid":"best matching project id"}]}\n\nUp to 6 items.`);
    let parsed;try{parsed=JSON.parse(tx.replace(/```json|```/g,'').trim())}catch(e){parsed={items:[]}}
    m.aiItems=(parsed.items||[]).map(item=>({...item,id:'ai'+uid(),done:false}));
    save();render();renderMeetingView(m);
  }catch(e){if(out)out.innerHTML=`<span style="font-size:12px;color:var(--danger)">Error: ${e.message}</span>`;}
}
function convertAIItem(mid,idx){
  const m=gm(mid);if(!m)return;const item=m.aiItems[idx];if(!item||item.done)return;
  if(item.type==='task'){
    const tid=createTask({title:item.text,priority:item.priority||'medium',pid:item.pid||S.projects[0]?.id,status:'todo',assignee:0,due:'',tags:['From meeting'],desc:`From: ${m.title}`});
    if(tid){if(!m.linkedTasks)m.linkedTasks=[];if(!m.linkedTasks.includes(tid))m.linkedTasks.push(tid);}
    item.done=true;
  } else {
    const p={id:'p'+uid(),name:item.text,hex:PALETTE[Math.floor(Math.random()*PALETTE.length)]};S.projects.push(p);item.done=true;
  }
  save();render();renderMeetingView(m);
}
function dismissAIItem(mid,idx){const m=gm(mid);if(!m)return;m.aiItems[idx].done=true;save();renderMeetingView(m);}
function taskFromSelection(mid){
  const sel=window.getSelection()?.toString()?.trim();if(!sel||sel.length<3)return;
  const m=gm(mid);
  const tid=createTask({title:sel,priority:'medium',pid:S.projects[0]?.id,status:'todo',assignee:0,due:'',tags:['From meeting'],desc:`From: ${m?.title||''}`});

  else if(S.filter!=='all')tasks=tasks.filter(t=>t.priority===S.filter);
  if(S.search)tasks=tasks.filter(t=>t.title.toLowerCase().includes(S.search.toLowerCase()));
  main.innerHTML=`<div class="topbar"><span class="topbar-title">All tasks</span><button class="btn primary" onclick="openTaskModal()"><i class="ti ti-plus"></i> Add task</button></div><div class="filter-bar">${['all','mine','agenda','urgent','high','overdue'].map(f=>`<button class="fpill ${S.filter===f?'active':''}" onclick="setFilter('${f}')">${{all:'All',mine:'Mine',agenda:'On agenda',urgent:'Urgent',high:'High',overdue:'Overdue'}[f]}</button>`).join('')}<div class="sw"><i class="ti ti-search"></i><input class="si" placeholder="Search..." oninput="S.search=this.value;renderAllTasks()" value="${S.search}"/></div></div><div style="flex:1;overflow-y:auto;padding:14px 18px">${S.projects.map(p=>{const pt=tasks.filter(t=>t.pid===p.id);if(!pt.length)return'';return`<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--border-light)"><span style="width:9px;height:9px;border-radius:50%;background:${p.hex}"></span><span style="font-size:13px;font-weight:500">${p.name}</span><span style="font-size:11px;color:var(--text-tertiary)">${pt.length} tasks</span></div>${pt.map(t=>{const pr=PRI[t.priority];const av=AVS[t.assignee];const isOv=t.due&&new Date(t.due)<new Date()&&t.status!=='done';const agMs=taskAgMeetings(t.id);return`<div style="display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:var(--radius-md);cursor:pointer" onclick="openTaskDetail('${t.id}')" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background='none'"><i class="ti ${pr.icon}" style="font-size:13px;color:${pr.color};flex-shrink:0"></i><span style="font-size:12px;flex:1;line-height:1.3">${t.title}</span>${agMs.length?`<span style="font-size:10px;color:#534AB7;background:#EEEDFE;padding:1px 6px;border-radius:3px;display:flex;align-items:center;gap:2px"><i class="ti ti-speakerphone" style="font-size:9px"></i>${agMs.length}</span>`:''}<span style="font-size:11px;color:var(--text-tertiary);background:var(--bg-secondary);padding:1px 6px;border-radius:3px">${COLS.find(c=>c.id===t.status)?.label}</span>${t.due?`<span style="font-size:11px;color:${isOv?'var(--danger)':'var(--text-tertiary)'}">${t.due.slice(5)}</span>`:''}<span class="av" style="background:${av.bg};color:${av.tc}">${av.init}</span></div>`;}).join('')}</div>`;}).join('')||'<div style="font-size:13px;color:var(--text-tertiary);padding:14px 0">No tasks match this filter.</div>'}</div>`;
}
function renderOverview(){
  const main=document.getElementById('main-view');if(!main)return;
  const all=S.tasks;const bySt=Object.fromEntries(COLS.map(c=>[c.id,all.filter(t=>t.status===c.id).length]));
  const ov=all.filter(t=>t.due&&new Date(t.due)<new Date()&&t.status!=='done').length;
  const bPr=Object.fromEntries(Object.keys(PRI).map(k=>[k,all.filter(t=>t.priority===k&&t.status!=='done').length]));
  const onAg=all.filter(t=>taskAgMeetings(t.id).length>0).length;
  const totalOpenAg=S.meetings.reduce((n,m)=>n+(m.agendaItems||[]).filter(a=>!a.resolved).length,0);
  main.innerHTML=`<div class="topbar"><span class="topbar-title">Overview</span></div><div style="flex:1;overflow-y:auto;padding:14px 18px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">${COLS.map(c=>`<div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:9px 11px"><div style="font-size:11px;color:var(--text-secondary);margin-bottom:3px">${c.label}</div><div style="font-size:22px;font-weight:500;color:${c.color}">${bySt[c.id]||0}</div></div>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"><div style="background:#EEEDFE;border-radius:var(--radius-md);padding:9px 11px"><div style="font-size:11px;color:#534AB7;margin-bottom:3px;display:flex;align-items:center;gap:3px"><i class="ti ti-speakerphone" style="font-size:11px"></i> Tasks on agenda</div><div style="font-size:22px;font-weight:500;color:#3C3489">${onAg}</div></div><div style="background:#EEEDFE;border-radius:var(--radius-md);padding:9px 11px"><div style="font-size:11px;color:#534AB7;margin-bottom:3px">Open agenda items</div><div style="font-size:22px;font-weight:500;color:#3C3489">${totalOpenAg}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div style="font-size:11px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Projects</div>${S.projects.map(p=>{const pt=S.tasks.filter(t=>t.pid===p.id);const done=pt.filter(t=>t.status==='done').length;const pct=pt.length?Math.round(done/pt.length*100):0;return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border-light);cursor:pointer" onclick="setProject('${p.id}')"><span style="width:8px;height:8px;border-radius:50%;background:${p.hex};flex-shrink:0"></span><span style="font-size:12px;flex:1">${p.name}</span><div style="width:55px;height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${p.hex}"></div></div><span style="font-size:11px;color:var(--text-secondary);min-width:26px;text-align:right">${pct}%</span></div>`;}).join('')}<div style="font-size:11px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px">Priority breakdown</div><div style="display:flex;gap:5px">${Object.entries(PRI).map(([k,v])=>`<div style="flex:1;background:${v.bg};border-radius:var(--radius-md);padding:7px 9px;text-align:center"><div style="font-size:18px;font-weight:500;color:${v.tc}">${bPr[k]||0}</div><div style="font-size:10px;color:${v.tc};margin-top:2px">${v.label}</div></div>`).join('')}</div></div><div><div style="font-size:11px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Meeting series</div>${S.series.map(ser=>{const c=sc(ser.id);const ms=S.meetings.filter(m=>m.sid===ser.id);const openAg=ms.reduce((n,m)=>n+(m.agendaItems||[]).filter(a=>!a.resolved).length,0);return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border-light);cursor:pointer" onclick="setSeries('${ser.id}')"><span style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0"></span><span style="font-size:12px;flex:1">${ser.name}</span><span style="font-size:11px;color:var(--text-secondary)">${ms.length} mtgs</span>${openAg?`<span style="font-size:10px;background:#EEEDFE;color:#3C3489;padding:1px 6px;border-radius:3px">${openAg} open</span>`:''}</div>`;}).join('')}${ov?`<div style="margin-top:14px;background:var(--bg-secondary);border-radius:var(--radius-md);padding:10px 12px;display:flex;align-items:center;gap:7px"><i class="ti ti-alert-circle" style="color:var(--danger);font-size:15px"></i><span style="font-size:12px"><strong>${ov}</strong> overdue task${ov!==1?'s':''}</span></div>`:''}</div></div></div>`;
}

function showModal(html){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modal-container').innerHTML=''}

function render(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navMap={week:'nv-week',allm:'nv-allm',overview:'nv-overview',alltasks:'nv-alltasks'};
  const nid=navMap[S.view];if(nid){const el=document.getElementById(nid);if(el)el.classList.add('active');}
  const wc=document.getElementById('week-count');if(wc){const today=new Date();const ws=new Date(today);ws.setDate(today.getDate()-today.getDay()+1);const we=new Date(ws);we.setDate(ws.getDate()+6);const fmt=d=>d.toISOString().slice(0,10);wc.textContent=S.meetings.filter(m=>m.date>=fmt(ws)&&m.date<=fmt(we)).length;}
  const ac=document.getElementById('allm-count');if(ac)ac.textContent=S.meetings.length;
  const tc=document.getElementById('alltasks-count');if(tc)tc.textContent=S.tasks.length;
  const sn=document.getElementById('series-nav');
  if(sn)sn.innerHTML=S.series.map(s=>{const c=sc(s.id);const cnt=S.meetings.filter(m=>m.sid===s.id).length;return`<button class="nav-item ${S.view==='series'&&S.activeSeries===s.id?'active':''}" onclick="setSeries('${s.id}')"><span class="nav-dot" style="background:${c.color}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${s.name}</span><span class="nav-count">${cnt}</span></button>`;}).join('')+`<button class="nav-item" onclick="openSeriesModal()" style="color:var(--text-tertiary);font-size:11px"><i class="ti ti-plus" style="font-size:11px"></i> New series</button>`;
  const pn=document.getElementById('proj-nav');
  if(pn)pn.innerHTML=S.projects.map(p=>{const cnt=S.tasks.filter(t=>t.pid===p.id).length;return`<button class="nav-item ${S.view==='board'&&S.activeProject===p.id?'active':''}" onclick="setProject('${p.id}')"><span class="nav-dot" style="background:${p.hex}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${p.name}</span><span class="nav-count">${cnt}</span></button>`;}).join('');
  if(S.view==='week')renderWeek();
  else if(S.view==='allm')renderAllMeetings();
  else if(S.view==='series')renderSeriesView();
  else if(S.view==='board')renderBoard();
  else if(S.view==='alltasks')renderAllTasks();
  else if(S.view==='meeting'&&S.activeMeeting)renderMeetingView(gm(S.activeMeeting));
  else if(S.view==='meeting-edit'&&S.editingMeeting)renderMeetingEdit(S.editingMeeting);
  else if(S.view==='overview')renderOverview();
}

load();render();
</script>
</body>
</html>
